spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/globetrotter_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
